<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Solicitudes - Módulo 1</title>
  <link rel="stylesheet" href="css.css">
  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input { display: block; width: 95%; padding: 8px; margin: 8px 0 15px; }
    button { padding: 10px 15px; cursor: pointer; margin-right: 8px; }
    .oculto { display: none; }
    .ok { color: green; font-weight: bold; }
    .err { color: red; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Inicio</a> |
    <a href="catalogo.html">Catálogo</a> |
    <a href="acerca.html">Acerca de...</a>
  </nav>

  <h1>Portal de Solicitudes</h1>

  <!-- SECCIÓN 1: FORMULARIO DE AUTENTICACIÓN -->
  <div id="seccion-login" class="card">
    <h2>Iniciar sesión o crear cuenta</h2>
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" placeholder="ejemplo@correo.com">

    <label for="pass">Contraseña (mínimo 6 caracteres):</label>
    <input type="password" id="pass" placeholder="******">

    <button onclick="entrar()">Iniciar sesión</button>
    <button onclick="registrar()">Crear cuenta</button>
    <p id="ml"></p>
  </div>

  <!-- SECCIÓN 2: PANEL PROTEGIDO POR SESIÓN -->
  <div id="seccion-app" class="card oculto">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Panel de Solicitudes</h2>
      <button onclick="salir()">Cerrar sesión</button>
    </div>
    <p>Conectado como: <strong id="correo-usuario"></strong></p>

    <hr>
    <h3>Nueva solicitud</h3>
    <input type="text" id="titulo" placeholder="Título de la solicitud">
    <input type="number" id="monto" placeholder="Monto ($)">
    <button onclick="guardarSolicitud()">Guardar solicitud</button>
    <p id="ms"></p>

    <h3>Solicitudes registradas</h3>
    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Monto</th>
          <th>Usuario (Email)</th>
        </tr>
      </thead>
      <tbody id="tabla-solicitudes"></tbody>
    </table>
  </div>

  <!-- Conexión a tu proyecto -->
  <script src="supabase-config.js"></script>

  <script>
    const val = (id) => document.getElementById(id).value.trim();
    const msg = (id, texto, ok) => {
      const el = document.getElementById(id);
      el.textContent = texto;
      el.className = ok ? 'ok' : 'err';
    };

    // 1. Registrar cuenta nueva en Supabase Auth
    async function registrar() {
      const { error } = await supabase.auth.signUp({
        email: val('email'),
        password: val('pass')
      });
      if (error) return msg('ml', 'Error: ' + error.message, false);
      msg('ml', 'Cuenta creada. Ya puedes iniciar sesión.', true);
    }

    // 2. Iniciar sesión con correo y contraseña
    async function entrar() {
      const { error } = await supabase.auth.signInWithPassword({
        email: val('email'),
        password: val('pass')
      });
      if (error) return msg('ml', 'Credenciales incorrectas', false);
      mostrarApp();
    }

    // 3. Mostrar panel protegido y cargar datos
    async function mostrarApp() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      document.getElementById('seccion-login').classList.add('oculto');
      document.getElementById('seccion-app').classList.remove('oculto');
      document.getElementById('correo-usuario').textContent = user.email;
      cargarSolicitudes();
    }

    // 4. Al cargar la página, verificar si ya existe sesión activa
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) mostrarApp();
    })();

    // 5. Guardar solicitud asociando el correo del usuario
    async function guardarSolicitud() {
      const titulo = val('titulo');
      const monto = val('monto');
      if (!titulo || !monto) return msg('ms', 'Completa título y monto', false);

      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase
        .from('solicitudes')
        .insert({ titulo, monto, usuario_email: user.email });

      if (error) return msg('ms', 'Error al guardar: ' + error.message, false);

      msg('ms', 'Solicitud guardada correctamente', true);
      document.getElementById('titulo').value = '';
      document.getElementById('monto').value = '';
      cargarSolicitudes();
    }

    // Listar solicitudes en la tabla
    async function cargarSolicitudes() {
      const { data } = await supabase
        .from('solicitudes')
        .select('*')
        .order('id', { ascending: false });

      const tbody = document.getElementById('tabla-solicitudes');
      tbody.innerHTML = '';
      if (data) {
        data.forEach(item => {
          tbody.innerHTML += `<tr>
            <td>${item.titulo}</td>
            <td>$${item.monto}</td>
            <td>${item.usuario_email || 'Sin correo'}</td>
          </tr>`;
        });
      }
    }

    // 6. Cerrar sesión y volver al formulario de login
    async function salir() {
      await supabase.auth.signOut();
      document.getElementById('seccion-app').classList.add('oculto');
      document.getElementById('seccion-login').classList.remove('oculto');
      msg('ml', 'Sesión cerrada', true);
    }
  </script>
</body>
</html>
